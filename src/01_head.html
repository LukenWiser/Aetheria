<title>Aetheria: Quantum Strike</title>
<style>
:root{
  color-scheme:dark;--bg:#04070f;--fg:#e6f0ff;--mut:#8ea4c4;--acc:#22d3ee;--acc2:#818cf8;--line:rgba(56,189,248,.28);--line2:rgba(56,189,248,.55);
  --hull:#fb7185;--aeg:#38bdf8;--pla:#2dd4bf;--gold:#fbbf24;--good:#34d399;--bad:#f43f5e;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;--rx:0deg;--ry:0deg;--w:#22d3ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--mono);overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#cvBg{z-index:0}#cvFx{z-index:2;pointer-events:none}
#vig{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
#flash{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 50%,rgba(244,63,94,0),rgba(244,63,94,.55))}
#ui{position:absolute;inset:0;z-index:10}
button{font-family:inherit;color:inherit}
h2{margin:0 0 4px;font:900 15px var(--mono);letter-spacing:.2em;color:var(--acc);text-transform:uppercase}
p{margin:0}.mut{color:var(--mut)}.acc{color:var(--acc)}.gold{color:var(--gold)}.good{color:var(--good)}.bad{color:var(--bad)}.sm{font-size:11px}.xs{font-size:10px}.tc{text-align:center}.b{font-weight:800}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.col{display:flex;flex-direction:column;gap:10px}.wrap{flex-wrap:wrap}.g6{gap:6px}.fl{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.card{position:relative;width:min(560px,100%);max-height:calc(100vh - 22px);max-height:calc(100dvh - 22px);overflow:auto;padding:22px;border-radius:18px;background:linear-gradient(155deg,rgba(20,38,72,.95),rgba(7,13,28,.96));border:1px solid var(--line2);

/* expedition map */
#ui .card.mp2{width:min(1180px,100%);padding:28px}
.mp2 h2{font-size:clamp(40px,7.5vh,84px)!important;color:var(--wc,#fff)!important;filter:drop-shadow(0 4px 22px color-mix(in srgb,var(--wc,#fff) 40%,transparent))}
#ui .mp2 .tabs.wf{flex-wrap:wrap;gap:6px;overflow:visible;margin:12px 0 4px}
#ui .mp2 .tabs.wf .tab{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;gap:2px;border:1px solid rgba(142,164,196,.25);border-radius:10px;font:800 18px var(--disp);color:#c7d4ea;position:relative}
#ui .mp2 .tabs.wf .tab svg{width:11px;height:11px;position:absolute;right:3px;bottom:3px;opacity:.7}
#ui .mp2 .tabs.wf .tab.on{background:var(--pa);border-color:var(--pa);color:#04101c}#ui .mp2 .tabs.wf .tab.lk{opacity:.35}#ui .mp2 .tabs.wf .tab:hover{border-color:var(--pa)}
#ui .mp2 #mapScroll{margin-top:10px;padding:26px 8px 18px;border-radius:16px;background:rgba(3,7,16,.45);border:1px solid rgba(142,164,196,.12)}
#ui .mp2 .node{width:64px;height:64px;border-radius:16px}#ui .mp2 .node.bs{width:76px;height:76px}
#ui .mp2 .item{margin-top:14px!important;padding:16px 18px;position:sticky;bottom:-28px;z-index:3;background:rgba(9,16,32,.97)}
@media (max-height:560px){#ui .card.mp2{padding:14px 18px}.mp2 h2{font-size:34px!important}#ui .mp2 .tabs.wf{margin:6px 0 2px;gap:4px}#ui .mp2 .tabs.wf .tab{width:30px;height:30px;font-size:14px}#ui .mp2 #mapScroll{padding:12px 6px 8px;margin-top:6px}#ui .mp2 .node{width:50px;height:50px}#ui .mp2 .node.bs{width:58px;height:58px}#ui .mp2 .item{margin-top:8px!important;padding:10px 12px;bottom:-14px}#ui .mp2 .item .b{font-size:20px!important}}#ui .mp2 .item .b{font:800 26px/1 var(--disp)!important;text-transform:uppercase;letter-spacing:.02em!important}
@media (max-width:760px),(max-aspect-ratio:1/1){
  .sm-cols,.sh-cols,.lay-pause{grid-template-columns:1fr}.sm-list{max-height:42vh}.sm-brief{justify-self:stretch;align-self:start}
  .sh-rail{flex-direction:row;overflow-x:auto}.sh-cat small{display:none}.sh-cat span{font-size:20px}
  .lay-pause .ps-run{align-self:start;grid-column:1;grid-row:3}.ps-nav .mm-nav:not(.ps-first) .mm-w{font-size:34px}
  #ui .card.rs,#ui .card.st2,#ui .card.pf2,#ui .card.hg2{grid-template-columns:1fr;padding:18px}.st-rail .tabs{flex-direction:row;flex-wrap:wrap}#ui .st-rail .tab{font-size:16px}
  .pf-right{max-height:none}
}

/* intro movie */
#intro{position:fixed;inset:0;z-index:9999;background:#000;overflow:hidden;transition:background .35s;cursor:pointer}
#intro.clear{background:transparent}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
.in-pre{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;animation:inPre 3.45s .1s ease forwards}
@keyframes inPre{0%,86%{opacity:1;transform:translateY(-50%) scale(1)}100%{opacity:0;transform:translateY(-50%) scale(1.12)}}
.in-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.in-l1{display:flex;font-family:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;font-weight:900;font-size:clamp(60px,14vw,200px);line-height:.88;letter-spacing:.03em;color:#fff;text-transform:uppercase;text-shadow:0 0 26px var(--pa),0 0 90px var(--pa),0 4px 0 rgba(0,0,0,.4)}
.in-l1 span{display:inline-block;opacity:0}
#intro.title .in-l1 span{animation:inSlam .46s calc(var(--i) * 75ms) cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes inSlam{0%{opacity:0;transform:scale(2.8) translateY(-24px);filter:blur(14px)}55%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
.in-l2{margin-top:.35em;font:800 clamp(14px,2.6vw,30px) system-ui,sans-serif;letter-spacing:.62em;text-transform:uppercase;color:var(--pa);opacity:0;transform:translateY(16px);text-shadow:0 0 16px rgba(0,0,0,.9)}
#intro.sub .in-l2{transition:opacity .6s ease,transform .6s ease;opacity:1;transform:none}
#intro.out .in-t{transition:opacity .8s ease,transform .9s ease;opacity:0;transform:scale(1.1)}
.in-skip{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));color:rgba(255,255,255,.5);font:600 11px system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;transition:opacity .4s}
#intro.out .in-skip{opacity:0}
body.intro #ui .scr.on{opacity:0;pointer-events:none}
body.introfade #ui .scr.on{transition:opacity 1s ease}
/* flying menu: keep the left side readable over the 3D world */
.mm{background:linear-gradient(90deg,rgba(3,6,14,.82) 0%,rgba(3,6,14,.55) 34%,rgba(3,6,14,.08) 62%,transparent 80%),linear-gradient(0deg,rgba(3,6,14,.7) 0%,transparent 26%)}
@media (max-width:760px){.mm{background:linear-gradient(0deg,rgba(3,6,14,.9) 0%,rgba(3,6,14,.6) 55%,rgba(3,6,14,.1) 80%,transparent 100%)}}

/* Driftwire Games logo */
.dw{display:inline-flex;align-items:center;gap:.28em;font-size:40px;line-height:1}
.dw-e{width:1.9em;height:1.9em;flex:none;overflow:visible}
.dw-t{text-align:left}
.dw-1{font-family:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;font-weight:900;font-style:italic;font-size:1em;letter-spacing:.04em;color:#fff;line-height:.9}
.dw-2{font:700 .26em system-ui,sans-serif;letter-spacing:.78em;color:#7dd3fc;margin-top:.35em}
.dw-cr{font-size:34px}
.mm-cred{display:inline-flex!important;align-items:center;gap:6px}

.dw-e.dw-sm{width:20px;height:20px}
.dw-in{font-size:clamp(34px,6vw,64px)}
.in-pres{margin-top:16px;font:600 clamp(11px,1.4vw,14px) system-ui,sans-serif;letter-spacing:.6em;text-transform:uppercase;color:#94a3b8;opacity:0;animation:dwFade .6s 1.25s forwards}
#intro .dw-w{stroke-dasharray:1;stroke-dashoffset:1;animation:dwDraw .95s .35s cubic-bezier(.6,0,.3,1) forwards}
#intro .dw-w2{stroke-dasharray:1;stroke-dashoffset:1;animation:dwDraw .5s .9s ease-out forwards}
#intro .dw-n{opacity:0;transform-origin:19px 40px;transform-box:view-box;animation:dwPop .45s 1.2s cubic-bezier(.2,1.8,.4,1) forwards}
#intro .dw-t{opacity:0;transform:translateX(-14px);animation:dwSlide .6s 1s ease-out forwards}
@keyframes dwDraw{to{stroke-dashoffset:0}}
@keyframes dwPop{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
@keyframes dwSlide{to{opacity:1;transform:none}}
@keyframes dwFade{to{opacity:1}}

.lbrow{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05)}

/* 4-player HUD + room slots */
