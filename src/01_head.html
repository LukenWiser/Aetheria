<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04070f">
<title>Aetheria: Quantum Strike</title>
<style>
:root{
  color-scheme:dark;--bg:#04070f;--fg:#e6f0ff;--mut:#8ea4c4;--acc:#22d3ee;--acc2:#818cf8;--line:rgba(56,189,248,.28);--line2:rgba(56,189,248,.55);
  --hull:#fb7185;--aeg:#38bdf8;--pla:#2dd4bf;--gold:#fbbf24;--good:#34d399;--bad:#f43f5e;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;--rx:0deg;--ry:0deg;--w:#22d3ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--mono);overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#cvBg{z-index:0}#cvFx{z-index:2;pointer-events:none}
#vig{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
#flash{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 50%,rgba(244,63,94,0),rgba(244,63,94,.55))}
#ui{position:absolute;inset:0;z-index:10}
button{font-family:inherit;color:inherit}
h2{margin:0 0 4px;font:900 15px var(--mono);letter-spacing:.2em;color:var(--acc);text-transform:uppercase}
p{margin:0}.mut{color:var(--mut)}.acc{color:var(--acc)}.gold{color:var(--gold)}.good{color:var(--good)}.bad{color:var(--bad)}.sm{font-size:11px}.xs{font-size:10px}.tc{text-align:center}.b{font-weight:800}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.col{display:flex;flex-direction:column;gap:10px}.wrap{flex-wrap:wrap}.g6{gap:6px}.fl{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
hr{border:0;height:1px;background:var(--line);margin:12px 0}
/* ---------- screens + 3D cards ---------- */
.scr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:20;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:radial-gradient(ellipse at 50% 38%,rgba(8,16,36,.2),rgba(2,4,10,.7));-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.scr.on{display:flex}.scr.clear{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;pointer-events:none}.scr.clear>*{pointer-events:auto}
.card{position:relative;width:min(560px,100%);max-height:calc(100vh - 22px);max-height:calc(100dvh - 22px);overflow:auto;padding:22px;border-radius:18px;background:linear-gradient(155deg,rgba(20,38,72,.95),rgba(7,13,28,.96));border:1px solid var(--line2);
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 -2px 0 rgba(0,0,0,.45) inset,0 11px 0 -3px #050d1e,0 15px 0 -4px #030812,0 30px 50px rgba(0,0,0,.65),0 0 70px rgba(34,211,238,.1);
  transform:perspective(1300px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .2s ease-out;scrollbar-width:thin;scrollbar-color:#155e75 transparent}
.upd{display:flex;flex-direction:column;gap:10px;margin-top:12px;max-height:min(62vh,560px);overflow-y:auto;padding-right:4px}.updi{border:1px solid rgba(148,163,184,.22);border-radius:10px;padding:10px 12px;background:rgba(15,23,42,.45)}.updi.cur{border-color:var(--gold);box-shadow:0 0 18px rgba(251,191,36,.18)}.updi ul{margin:6px 0 0;padding-left:18px;font-size:12px;line-height:1.6;color:var(--mut)}.credit{cursor:pointer;letter-spacing:.14em;opacity:.85}.credit:hover{opacity:1}
.card.wide{width:min(980px,100%)}.card.mid{width:min(720px,100%)}
.scr.on .card{animation:pop3d .5s cubic-bezier(.2,.9,.25,1.08) backwards}
@keyframes pop3d{from{opacity:0;transform:perspective(1300px) rotateX(-26deg) translateY(40px) scale(.93)}to{opacity:1;transform:perspective(1300px) rotateX(0) translateY(0) scale(1)}}
.nofx .card,.nofx .pn,.nofx .btn{transform:none!important;animation:none!important}
.title{font:900 clamp(34px,9vw,68px)/1 var(--mono);letter-spacing:.16em;text-align:center;background:linear-gradient(180deg,#e8fcff,#38bdf8 52%,#6366f1);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #0a2f4a) drop-shadow(0 5px 0 #082338) drop-shadow(0 12px 12px rgba(0,0,0,.75))}
.subt{text-align:center;font:800 11px var(--mono);letter-spacing:.5em;color:var(--acc);margin:6px 0 20px;text-indent:.5em}
.stack{display:flex;flex-direction:column;gap:12px}
/* ---------- 3D buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;font:800 12px/1.1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#d9f7ff;cursor:pointer;
  background:linear-gradient(180deg,rgba(34,211,238,.34),rgba(14,116,144,.16));border:1px solid var(--line2);border-radius:12px;
  box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 6px 0 #063344,0 10px 16px rgba(0,0,0,.45);transform:translateY(0);transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.18);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 8px 0 #063344,0 14px 20px rgba(0,0,0,.5),0 0 20px rgba(34,211,238,.25)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 1px 0 #063344,0 3px 6px rgba(0,0,0,.5)}
.btn.big{padding:17px 20px;font-size:14px;background:linear-gradient(180deg,rgba(52,211,153,.38),rgba(5,150,105,.2));border-color:rgba(52,211,153,.7);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 7px 0 #064e3b,0 12px 18px rgba(0,0,0,.45);color:#d1fae5}
.btn.big:hover{box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 9px 0 #064e3b,0 16px 22px rgba(0,0,0,.5),0 0 22px rgba(52,211,153,.3)}
.btn.sm{padding:9px 12px;font-size:10px;border-radius:10px;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 4px 0 #063344,0 7px 12px rgba(0,0,0,.4)}
.btn.warn{background:linear-gradient(180deg,rgba(251,113,133,.34),rgba(159,18,57,.18));border-color:rgba(251,113,133,.65);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 6px 0 #4c0519,0 10px 16px rgba(0,0,0,.45);color:#ffe4e6}
.btn.gold{background:linear-gradient(180deg,rgba(251,191,36,.36),rgba(180,83,9,.2));border-color:rgba(251,191,36,.7);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 6px 0 #5a3205,0 10px 16px rgba(0,0,0,.45);color:#fef3c7}
.btn:disabled,.btn.off{opacity:.42;filter:grayscale(.7);pointer-events:none}
.btn.on{filter:brightness(1.35);border-color:#fff}
.seg{display:flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:0 5px 0 #063344}
.seg button{flex:1;padding:11px 8px;font:800 11px var(--mono);letter-spacing:.12em;background:rgba(10,24,48,.8);border:0;cursor:pointer;color:var(--mut)}
.seg button.on{background:linear-gradient(180deg,rgba(34,211,238,.5),rgba(14,116,144,.35));color:#fff}
/* ---------- bars ---------- */
.bar{position:relative;height:12px;border-radius:7px;background:linear-gradient(180deg,#010510,#0b1a36);box-shadow:0 1px 0 rgba(255,255,255,.12),0 2px 6px rgba(0,0,0,.7) inset,0 0 0 1px rgba(56,189,248,.22) inset;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:7px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 46%,rgba(0,0,0,.3)),var(--c,#22d3ee);box-shadow:0 0 12px var(--c,#22d3ee);transition:width .16s linear}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.38) 0 1px,transparent 1px 12px);pointer-events:none}
.bar.lo i{animation:lowpulse .5s infinite alternate}
@keyframes lowpulse{to{filter:brightness(1.6)}}
/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;display:none;pointer-events:none;z-index:10}#hud.on{display:block}
.pn{position:absolute;top:calc(8px + env(safe-area-inset-top));width:min(236px,31vw);padding:8px 10px 9px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(18,36,68,.84),rgba(6,12,26,.74));box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 7px 0 -2px #04101f,0 14px 22px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:floaty 5s ease-in-out infinite}
.pn.l{left:calc(8px + env(safe-area-inset-left));transform:perspective(800px) rotateY(11deg) rotateX(2deg);transform-origin:0 0}
.pn.r{right:calc(8px + env(safe-area-inset-right));transform:perspective(800px) rotateY(-11deg) rotateX(2deg);transform-origin:100% 0;animation-delay:-2s;display:none}
.coop .pn.r{display:block}
@keyframes floaty{50%{margin-top:3px}}
.nofx .pn,.reduce .pn{animation:none}
.pn .nm{display:flex;justify-content:space-between;align-items:center;font:800 10px var(--mono);letter-spacing:.16em;margin-bottom:5px;color:var(--acc)}
.pn .nm em{font-style:normal;color:var(--gold)}
.pn .rw{display:flex;align-items:center;gap:6px;margin:4px 0}.pn .rw svg{width:15px;height:15px;flex:none}.pn .rw .bar{flex:1;height:9px}
.pn .rw b{font:700 9px var(--mono);min-width:50px;text-align:right;color:var(--mut)}
.pn .gn{display:flex;justify-content:space-between;font:700 9px var(--mono);color:var(--mut);margin-top:2px;letter-spacing:.1em}
#top{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) perspective(700px) rotateX(8deg);display:flex;flex-direction:column;align-items:center;gap:5px;width:min(420px,36vw);min-width:200px}
#top .ob{padding:6px 14px;border-radius:10px;border:1px solid var(--line2);background:linear-gradient(180deg,rgba(18,36,68,.85),rgba(6,12,26,.8));font:800 11px var(--mono);letter-spacing:.14em;text-align:center;box-shadow:0 5px 0 -1px #04101f,0 10px 16px rgba(0,0,0,.45);white-space:nowrap}
#top .sc{display:flex;gap:12px;font:800 11px var(--mono);letter-spacing:.1em;color:var(--mut);text-shadow:0 2px 0 #000}
#top .sc b{color:var(--fg)}#top .sc .cb{color:var(--gold)}
#boss{display:none;width:100%}#boss.on{display:block}
#boss .bn{font:900 11px var(--mono);letter-spacing:.2em;color:#fecdd3;text-align:center;margin-bottom:3px;text-shadow:0 2px 0 #000}
#boss .bar{height:14px;--c:#f43f5e}
#boss .bar i{transition:width .1s linear}
#alert,#banner{position:absolute;left:0;right:0;text-align:center;pointer-events:none;z-index:12}
#alert{bottom:calc(88px + env(safe-area-inset-bottom));font:800 12px var(--mono);letter-spacing:.2em;color:var(--acc);text-shadow:0 0 12px rgba(34,211,238,.8),0 2px 0 #000;opacity:0;transition:opacity .3s}
#banner{top:24%;opacity:0}
#banner .t{font:900 clamp(24px,6.5vw,52px) var(--mono);letter-spacing:.22em;color:#fff;text-shadow:0 2px 0 #0e7490,0 5px 0 #083344,0 10px 18px rgba(0,0,0,.8),0 0 30px rgba(34,211,238,.6)}
#banner .s{font:800 12px var(--mono);letter-spacing:.36em;color:var(--acc);margin-top:8px;text-shadow:0 2px 0 #000}
#banner.show{animation:ban 2.4s cubic-bezier(.2,.8,.2,1) both}#banner.boss .t{color:#ffe4e6;text-shadow:0 2px 0 #9f1239,0 5px 0 #4c0519,0 10px 18px rgba(0,0,0,.8),0 0 36px rgba(244,63,94,.8)}
@keyframes ban{0%{opacity:0;transform:perspective(900px) rotateX(70deg) translateY(30px) scale(.8)}14%{opacity:1;transform:perspective(900px) rotateX(0) scale(1.04)}22%{transform:perspective(900px) scale(1)}82%{opacity:1}100%{opacity:0;transform:perspective(900px) rotateX(-40deg) translateY(-30px) scale(1.1)}}
.reduce #banner.show{animation:banr 2.2s both}@keyframes banr{0%,100%{opacity:0}15%,80%{opacity:1}}
#lbT,#lbB{position:absolute;left:0;right:0;height:0;background:#000;z-index:11;pointer-events:none;transition:height .5s ease}#lbT{top:0}#lbB{bottom:0}.lb #lbT,.lb #lbB{height:11vh}
#coach{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%) perspective(900px) rotateX(6deg);width:min(560px,94vw);display:none;z-index:15;pointer-events:auto;padding:14px 16px;border-radius:14px;border:1px solid rgba(251,191,36,.6);background:linear-gradient(160deg,rgba(40,30,8,.92),rgba(10,10,20,.92));box-shadow:0 8px 0 -2px #2a1a03,0 18px 28px rgba(0,0,0,.6),0 0 30px rgba(251,191,36,.18)}
#coach.on{display:block;animation:pop3d .4s backwards}
#coach .ct{font:900 11px var(--mono);letter-spacing:.2em;color:var(--gold);display:flex;justify-content:space-between}#coach .cx{font:600 12px/1.55 var(--mono);color:#fff4d0;margin:6px 0 8px}
#coach .dots{display:flex;gap:4px}#coach .dots i{width:16px;height:4px;border-radius:2px;background:rgba(251,191,36,.25)}#coach .dots i.on{background:var(--gold)}#coach .dots i.d{background:#34d399}
#hl{position:absolute;display:none;z-index:14;pointer-events:none;border:2px solid var(--gold);border-radius:12px;box-shadow:0 0 0 4px rgba(251,191,36,.22),0 0 24px rgba(251,191,36,.7);animation:hlp .8s ease-in-out infinite alternate}@keyframes hlp{to{transform:scale(1.06);opacity:.6}}
#fps{position:absolute;left:8px;bottom:8px;z-index:30;font:700 10px var(--mono);color:#67e8f9;display:none;pointer-events:none}
#rot{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(2,5,12,.94);text-align:center;padding:30px;font:800 13px/1.6 var(--mono);letter-spacing:.14em}
#rot svg{width:84px;height:84px;animation:rotp 2.4s ease-in-out infinite}@keyframes rotp{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
/* ---------- touch ---------- */
#touch{position:absolute;inset:0;display:none;pointer-events:none;z-index:16}#touch.on{display:block}
#touch>*{pointer-events:auto;touch-action:none;position:absolute}
.tstick{width:132px;height:132px;border-radius:50%;bottom:calc(20px + env(safe-area-inset-bottom));background:radial-gradient(circle at 40% 35%,rgba(56,189,248,.28),rgba(8,20,44,.55));border:2px solid rgba(56,189,248,.5);box-shadow:0 6px 0 rgba(4,16,34,.9),0 12px 22px rgba(0,0,0,.5)}
.tstick i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#cffafe,#22d3ee 55%,#0e7490);box-shadow:0 5px 0 #063344,0 8px 14px rgba(0,0,0,.5)}
.tbtn{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 12px var(--mono);letter-spacing:.1em;color:#fff;background:radial-gradient(circle at 38% 30%,rgba(251,113,133,.9),rgba(159,18,57,.85));border:2px solid rgba(255,255,255,.4);box-shadow:0 6px 0 #4c0519,0 12px 20px rgba(0,0,0,.5)}
.tbtn.sml{width:52px;height:52px;font-size:10px;background:radial-gradient(circle at 38% 30%,rgba(56,189,248,.8),rgba(8,47,73,.9));box-shadow:0 5px 0 #082f49,0 9px 14px rgba(0,0,0,.5)}
.tbtn.dn{transform:translateY(5px);box-shadow:0 1px 0 #4c0519}
/* ---------- map ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}.tabs.wrap{flex-wrap:wrap;overflow:visible;row-gap:4px}.tabs::-webkit-scrollbar{display:none}
@media (hover:hover) and (pointer:fine){.tabs.wf{flex-wrap:wrap;overflow:visible;row-gap:4px}}
.tab{flex:none;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(10,24,48,.8);font:800 10px var(--mono);letter-spacing:.1em;color:var(--mut);cursor:pointer;box-shadow:0 4px 0 #04101f;white-space:nowrap;text-transform:uppercase}
.tab.on{color:#fff;border-color:var(--line2);background:linear-gradient(180deg,rgba(34,211,238,.42),rgba(14,116,144,.3))}.tab.lk{opacity:.4}
#mapScroll{position:relative;overflow:auto;padding:16px 8px 22px;border-radius:12px;background:radial-gradient(ellipse at 20% 50%,var(--wc,rgba(34,211,238,.1)),transparent 70%),rgba(2,6,16,.55);border:1px solid var(--line);scrollbar-width:thin}
#mapIn{position:relative;display:flex;gap:30px;width:max-content;min-width:100%;align-items:center;padding:6px 14px}
#mapSvg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.tier{display:flex;flex-direction:column;gap:16px;align-items:center;position:relative;z-index:1}.tier>small{font:800 9px var(--mono);color:var(--mut);letter-spacing:.12em}
.node{position:relative;width:58px;height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:2px solid #334155;background:linear-gradient(160deg,#0f1a30,#070d1b);color:#64748b;font:800 9px var(--mono);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 6px 0 #03070f,0 10px 14px rgba(0,0,0,.5);transition:transform .15s}
.node svg{width:22px;height:22px}.node.av{border-color:var(--acc);color:#cffafe;background:linear-gradient(160deg,#0d3a52,#07182b);animation:nodep 1.5s ease-in-out infinite}.node.av:hover{transform:translateY(-4px) scale(1.06)}
.node.dn{border-color:#10b981;color:#6ee7b7;background:linear-gradient(160deg,#064e3b,#022c22);cursor:default}.node.lk{opacity:.45;cursor:default}.node.bs{width:68px;height:68px;border-color:#f43f5e}.node.av.bs{color:#ffe4e6;background:linear-gradient(160deg,#7f1d1d,#2b0a12)}
@keyframes nodep{50%{box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 6px 0 #03070f,0 10px 14px rgba(0,0,0,.5),0 0 22px rgba(34,211,238,.7)}}
/* ---------- modes / items / options ---------- */
.mode{position:relative;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(18,36,68,.9),rgba(8,16,34,.9));cursor:pointer;display:flex;flex-direction:column;gap:5px;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 6px 0 #04101f,0 10px 16px rgba(0,0,0,.4);transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-3px);border-color:var(--acc)}.mode b{font:900 13px var(--mono);letter-spacing:.14em;color:#fff}.mode span{font:500 11px/1.5 var(--mono);color:var(--mut)}.mode em{font:700 10px var(--mono);color:var(--gold);font-style:normal}
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(8,18,38,.85);box-shadow:0 4px 0 #04101f}
.item .ic{width:34px;height:34px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(34,211,238,.12);border:1px solid var(--line)}.item .ic svg{width:20px;height:20px}
.pips{display:flex;gap:2px;margin-top:4px}.pips i{width:9px;height:4px;border-radius:2px;background:#16263f}.pips i.on{background:var(--acc);box-shadow:0 0 6px var(--acc)}
.opt{position:relative;padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(8,18,38,.85);cursor:pointer;text-align:left;box-shadow:0 4px 0 #04101f;display:flex;flex-direction:column;gap:3px;transition:transform .12s}
.opt:hover{transform:translateY(-2px);border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:linear-gradient(160deg,rgba(14,116,144,.5),rgba(8,18,38,.9));box-shadow:0 4px 0 #063344,0 0 18px rgba(34,211,238,.25)}
.opt b{font:800 11px var(--mono);letter-spacing:.08em;color:#fff}.opt span{font:500 10px/1.4 var(--mono);color:var(--mut)}.opt .lock{font:800 10px var(--mono);color:var(--gold)}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;box-shadow:0 4px 0 #04101f}.sw.sel{border-color:#fff;box-shadow:0 4px 0 #04101f,0 0 14px #fff}
.st{display:grid;grid-template-columns:70px 1fr 34px;align-items:center;gap:8px;font:700 10px var(--mono);color:var(--mut);margin:5px 0}
